<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClawBuddy</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap");
      :root{color-scheme:dark;--bg:#07080d;--bg2:#0b1020;--surface:rgba(15,23,42,.68);--surface2:rgba(17,24,39,.82);--border:rgba(255,255,255,.07);--text:#f8fafc;--muted:#94a3b8;--emerald:#10b981;--cyan:#22d3ee;--amber:#f59e0b;--red:#ef4444;--shadow:0 24px 80px rgba(0,0,0,.45)}
      *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:"Space Grotesk",system-ui,sans-serif;background:
        radial-gradient(circle at 15% 10%, rgba(16,185,129,.16), transparent 22%),
        radial-gradient(circle at 85% 0%, rgba(34,211,238,.12), transparent 24%),

      button,input,select{font:inherit}a{color:inherit;text-decoration:none}

      .status-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
      .dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#64748b}.dot.active{background:var(--emerald);box-shadow:0 0 0 7px rgba(16,185,129,.12);animation:pulse 2s infinite}.dot.idle{background:var(--amber)}.dot.error{background:var(--red)}
      .nav{display:flex;flex-direction:column;gap:8px}.nav button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px solid transparent;color:var(--muted);padding:12px 14px;border-radius:14px;cursor:pointer;transition:.2s}.nav button:hover{background:rgba(255,255,255,.04);color:var(--text)}.nav button.active{background:linear-gradient(135deg, rgba(16,185,129,.16), rgba(34,211,238,.08));color:var(--text);border-color:rgba(16,185,129,.18);box-shadow:0 0 0 1px rgba(16,185,129,.08)}
      .sidebar .mini{margin-top:auto;padding:14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}.mono{font-family:"JetBrains Mono",monospace}
      .main{display:flex;flex-direction:column;gap:18px;min-width:0}

      .hero{display:flex;align-items:center;gap:16px}.hero h2{margin:0;font-size:1.5rem;letter-spacing:-.02em}.hero p{margin:4px 0 0;color:var(--muted)}
      .search{flex:1;max-width:440px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
      .search input{width:100%;background:transparent;border:0;outline:none;color:var(--text)}
      .topmeta{display:flex;align-items:center;gap:12px;color:var(--muted)}
      .tabs{display:flex;gap:10px;overflow:auto;padding:8px 0}.tabs button{background:transparent;border:1px solid rgba(255,255,255,.06);color:var(--muted);padding:11px 14px;border-radius:14px;cursor:pointer;white-space:nowrap}.tabs button.active{color:var(--text);background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.22)}
      .content{display:flex;flex-direction:column;gap:18px;min-width:0}
      .section{padding:18px}.section-title{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}.section-title h3{margin:0;font-size:1.05rem}.section-title p{margin:4px 0 0;color:var(--muted)}
      .grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.grid-2{display:grid;grid-template-columns:1.3fr .9fr;gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
      .metric{padding:18px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.metric::after{content:"";position:absolute;inset:auto -20% -50% auto;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle, rgba(16,185,129,.14), transparent 70%);filter:blur(6px)}
      .metric .icon{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(16,185,129,.12);color:var(--emerald);box-shadow:0 0 0 1px rgba(16,185,129,.14)}.metric strong{font-size:2rem;letter-spacing:-.03em}.metric .trend{font-size:.88rem;color:var(--emerald)}
      .panel{padding:18px}.list{display:flex;flex-direction:column;gap:12px}.item{display:flex;justify-content:space-between;gap:14px;padding:14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}.item:hover{border-color:rgba(16,185,129,.18);transform:translateY(-1px)}

      .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:.8rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}.pill.green{color:#86efac}.pill.cyan{color:#67e8f9}.pill.amber{color:#fcd34d}.pill.red{color:#fca5a5}
      .agent-card{padding:18px;display:flex;flex-direction:column;gap:14px}.agent-head{display:flex;justify-content:space-between;gap:12px}.agent-head .left{display:flex;gap:12px;align-items:flex-start}.agent-emoji{font-size:2rem;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
      .chip-row{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);font-size:.82rem}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;border-radius:14px;padding:11px 14px;color:var(--text);background:linear-gradient(135deg, rgba(16,185,129,.94), rgba(34,211,238,.72));box-shadow:0 10px 24px rgba(16,185,129,.2)}.btn.secondary{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);box-shadow:none}
      .kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow:auto;padding-bottom:4px}.col{padding:16px;min-height:420px}.task{padding:14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;gap:10px}.task:hover{transform:translateY(-2px);border-color:rgba(16,185,129,.18)}.prio{font-size:.75rem;border-radius:999px;padding:5px 8px;text-transform:uppercase;letter-spacing:.06em}.prio.low{background:rgba(96,165,250,.12);color:#93c5fd}.prio.medium{background:rgba(245,158,11,.12);color:#fcd34d}.prio.high,.prio.urgent{background:rgba(239,68,68,.12);color:#fca5a5}
      .filters{display:grid;gap:12px}.filters-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.input, .select{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;color:var(--text);padding:11px 12px}.input{flex:1;min-width:240px}
      .toggle{display:inline-flex;align-items:center;gap:8px;padding:9px 11px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);cursor:pointer}.toggle.active{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.2)}
      .log{display:flex;flex-direction:column;gap:10px}.log-item{padding:14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;gap:12px}
      .council{display:flex;flex-direction:column;gap:12px}.council-card{padding:16px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}.c-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;cursor:pointer}.c-body{margin-top:14px;display:flex;flex-direction:column;gap:10px}.msg{padding:12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
      .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chart-box{padding:18px}.donut{width:240px;height:240px;border-radius:50%;background:conic-gradient(#60a5fa 0 18%, #a78bfa 18% 36%, #34d399 36% 52%, #fb923c 52% 66%, #818cf8 66% 84%, #2dd4bf 84% 100%);margin:12px auto;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 0 32px rgba(16,185,129,.08)}.donut::after{content:"";position:absolute;inset:54px;background:linear-gradient(180deg, rgba(10,12,20,.96), rgba(15,23,42,.96));border-radius:50%;border:1px solid rgba(255,255,255,.06)}
      .legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%}
      .bars{height:260px;display:flex;align-items:flex-end;gap:12px;padding:18px 10px 8px}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}.bar div{width:100%;max-width:44px;border-radius:14px 14px 0 0;background:linear-gradient(180deg, rgba(16,185,129,.95), rgba(16,185,129,.28));box-shadow:0 0 26px rgba(16,185,129,.16)}
      @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.35)}70%{box-shadow:0 0 0 10px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
      @media (max-width: 1200px){.shell{grid-template-columns:1fr}.sidebar{position:relative;top:0;height:auto}.grid-4,.grid-2,.grid-3,.charts{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:repeat(4,minmax(260px,1fr))}}
      @media (max-width: 800px){.grid-4,.grid-2,.grid-3,.charts{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:stretch}.search{max-width:none}.kanban{display:flex}.section,.panel,.card{border-radius:16px}}
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="card sidebar">
        <div class="brand">
          <div class="paw">🐾</div>
          <div><h1>ClawBuddy</h1><p>AI Agent Command Center</p></div>
        </div>
        <div class="status-chip"><div><div class="tiny muted">Primary Agent</div><strong>Agent Alpha</strong></div><span class="dot active"></span></div>
        <div class="nav" id="sidebarTabs"></div>
        <div class="mini">
          <div class="tiny muted">Live system pulse</div>
          <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:8px"><strong style="font-size:1.9rem">98.4%</strong><span class="pill green">Stable</span></div>
          <div class="tiny muted" style="margin-top:8px">All local mock data · no backend</div>
        </div>
      </aside>

      <main class="main">
        <header class="card topbar">
          <div class="hero"><div><h2>Mission Control</h2><p>Premium dashboard for an AI workforce</p></div></div>
          <div class="search"><span>⌕</span><input id="globalSearch" placeholder="Search agents, tasks, meetings…" /></div>
          <div class="topmeta"><span class="dot active"></span><div><strong>Agent Alpha</strong><div class="tiny muted">Last seen: just now</div></div></div>
        </header>

        <nav class="tabs card section" id="topTabs" style="padding:10px 12px"></nav>
        <div class="content" id="content"></div>
      </main>
    </div>

    <script>
      const tabs = [["deck","Command Deck"],["agents","Agents"],["board","Task Board"],["log","AI Log"],["council","Council"],["meetings","Meetings"]];
      const agents = [
        { name:"Agent Alpha", emoji:"🤖", type:"Code Agent", role:"Lead Engineer", accent:"#10b981", status:"active", activity:"Refactoring task queue", lastSeen:"just now", tasksCompleted:128, accuracy:98.4, skills:["TypeScript","Architecture","Reviews"] },
        { name:"Dispatch Bot", emoji:"📋", type:"Coordinator", role:"Operations Director", accent:"#f59e0b", status:"idle", activity:"Waiting on next dispatch", lastSeen:"3m ago", tasksCompleted:84, accuracy:94.8, skills:["Scheduling","Routing","Planning"] },
        { name:"Audit Bot", emoji:"🛡️", type:"Quality Agent", role:"Compliance Officer", accent:"#06b6d4", status:"active", activity:"Reviewing log anomalies", lastSeen:"just now", tasksCompleted:212, accuracy:99.2, skills:["QA","Policy","Reporting"] }
      ];
      const activityFeed = [
        { emoji:"🤖", text:"Agent Alpha merged a patch into the command deck.", time:"2m ago" },
        { emoji:"📋", text:"Dispatch Bot redistributed 4 tasks after a priority shift.", time:"6m ago" },
        { emoji:"🛡️", text:"Audit Bot flagged one task for missing acceptance criteria.", time:"11m ago" },
        { emoji:"🤖", text:"Agent Alpha completed code review cycle #18.", time:"18m ago" },
        { emoji:"📋", text:"Dispatch Bot created a new council session for planning.", time:"27m ago" }
      ];
      const logs = [
        { category:"observation", agent:"Audit Bot", text:"Detected 2 duplicate task titles in the backlog.", time:"1m ago" },
        { category:"general", agent:"Agent Alpha", text:"Context window stable after queue compaction.", time:"4m ago" },
        { category:"reminder", agent:"Dispatch Bot", text:"Need human input on blocked integration spec.", time:"9m ago" },
        { category:"fyi", agent:"Audit Bot", text:"Weekly report export completed successfully.", time:"14m ago" },
        { category:"observation", agent:"Agent Alpha", text:"Build metrics improved by 7% after optimization.", time:"23m ago" },
        { category:"general", agent:"Dispatch Bot", text:"Rebalanced workstream load across active agents.", time:"31m ago" },
        { category:"reminder", agent:"Audit Bot", text:"Review unresolved high-priority items before EOD.", time:"42m ago" },
        { category:"fyi", agent:"Agent Alpha", text:"No regression detected in the latest iteration.", time:"55m ago" }
      ];
      const councils = [
        { question:"Should we prioritize reliability or throughput for the next sprint?", status:"In Debate", participants:[{ name:"Agent Alpha", emoji:"🤖", sent:3, limit:5 },{ name:"Dispatch Bot", emoji:"📋", sent:2, limit:4 },{ name:"Audit Bot", emoji:"🛡️", sent:3, limit:4 }], messages:[{ emoji:"🤖", name:"Agent Alpha", num:1, text:"Reliability protects compounding velocity; we'd rather ship fewer defects.", time:"3m ago" },{ emoji:"📋", name:"Dispatch Bot", num:2, text:"Throughput matters if we want the queue to keep breathing.", time:"2m ago" },{ emoji:"🛡️", name:"Audit Bot", num:3, text:"The strongest path is lower variance with targeted throughput gains.", time:"1m ago" }] },
        { question:"Which workflow should be automated next?", status:"Pending Vote", participants:[{ name:"Agent Alpha", emoji:"🤖", sent:1, limit:4 },{ name:"Dispatch Bot", emoji:"📋", sent:2, limit:4 },{ name:"Audit Bot", emoji:"🛡️", sent:1, limit:3 }], messages:[{ emoji:"📋", name:"Dispatch Bot", num:1, text:"Automate routing of repetitive tasks first.", time:"8m ago" },{ emoji:"🤖", name:"Agent Alpha", num:2, text:"Agree, but add guardrails before scaling the automation.", time:"6m ago" },{ emoji:"🛡️", name:"Audit Bot", num:3, text:"Include an audit trail from the start.", time:"4m ago" }] }
      ];
      const meetingTypes = { standup:"#818cf8", "1-on-1":"#60a5fa", external:"#a78bfa", sales:"#34d399", team:"#fb923c", planning:"#2dd4bf", interview:"#f43f5e", allhands:"#22c55e" };
      const meetings = [
        { title:"Weekly Standup with Engineering", date:"2026-02-25T10:00:00Z", duration_minutes:30, duration_display:"30m", attendees:["Alice","Bob","Charlie"], summary:"Discussed sprint progress. Backend API 80% complete.", action_items:[{ task:"Review PR #42", assignee:"Alice", done:false },{ task:"Update docs", assignee:"Bob", done:true }], ai_insights:"30 minute standup with 3 attendees.", meeting_type:"standup", sentiment:"positive", has_external_participants:false, external_domains:[] },
        { title:"Customer Expansion Call", date:"2026-02-24T15:00:00Z", duration_minutes:45, duration_display:"45m", attendees:["Mia","Jordan","Nina"], summary:"Reviewed renewal path and implementation milestones.", action_items:[{ task:"Send proposal revision", assignee:"Mia", done:false }], ai_insights:"High intent external sales call.", meeting_type:"sales", sentiment:"positive", has_external_participants:true, external_domains:["acme.com"] },
        { title:"Product Planning Session", date:"2026-02-20T09:00:00Z", duration_minutes:60, duration_display:"1h", attendees:["Sam","Taylor","Riley","Jordan"], summary:"Outlined Q2 goals, dependencies, and launch sequencing.", action_items:[{ task:"Finalize scope", assignee:"Taylor", done:false },{ task:"Draft timeline", assignee:"Sam", done:false }], ai_insights:"Planning session with multiple owners.", meeting_type:"planning", sentiment:"neutral", has_external_participants:false, external_domains:[] },
        { title:"Founder 1:1", date:"2026-02-18T13:00:00Z", duration_minutes:30, duration_display:"30m", attendees:["Alex","Founder"], summary:"Covered priorities, team shape, and hiring gaps.", action_items:[{ task:"Share hiring plan", assignee:"Alex", done:false }], ai_insights:"Focused decision-making and alignment.", meeting_type:"1-on-1", sentiment:"positive", has_external_participants:false, external_domains:[] },
        { title:"Candidate Interview", date:"2026-02-16T17:00:00Z", duration_minutes:50, duration_display:"50m", attendees:["Priya","Interviewer","Panel"], summary:"Evaluated systems design depth and collaboration style.", action_items:[{ task:"Compile feedback", assignee:"Panel", done:false }], ai_insights:"Strong technical signal, moderate communication variance.", meeting_type:"interview", sentiment:"neutral", has_external_participants:false, external_domains:[] },
        { title:"All-Hands Q1 Review", date:"2026-02-14T18:00:00Z", duration_minutes:75, duration_display:"1h 15m", attendees:["Team"], summary:"Shared company metrics, roadmap, and wins.", action_items:[{ task:"Publish recording notes", assignee:"Ops", done:true }], ai_insights:"Company-wide alignment session.", meeting_type:"allhands", sentiment:"positive", has_external_participants:false, external_domains:[] },
        { title:"Design Review with Client", date:"2026-02-12T14:30:00Z", duration_minutes:40, duration_display:"40m", attendees:["Elena","Client","Design"], summary:"Reviewed wireframes and revision requests.", action_items:[{ task:"Update hero section", assignee:"Design", done:false }], ai_insights:"External stakeholders requested a tighter scope.", meeting_type:"external", sentiment:"neutral", has_external_participants:true, external_domains:["clientstudio.io"] },
        { title:"1:1 with Engineering Lead", date:"2026-02-10T11:00:00Z", duration_minutes:25, duration_display:"25m", attendees:["Lee","Morgan"], summary:"Discussed performance, mentorship, and career growth.", action_items:[{ task:"Share feedback notes", assignee:"Lee", done:true }], ai_insights:"Healthy manager-reporting cadence.", meeting_type:"1-on-1", sentiment:"positive", has_external_participants:false, external_domains:[] },
        { title:"Sales Demo: Northwind", date:"2026-02-09T16:00:00Z", duration_minutes:35, duration_display:"35m", attendees:["Sales","Northwind"], summary:"Demoed onboarding and summarized rollout steps.", action_items:[{ task:"Send security packet", assignee:"Sales", done:false }], ai_insights:"External sales conversation with strong engagement.", meeting_type:"sales", sentiment:"positive", has_external_participants:true, external_domains:["northwind.com"] },
        { title:"Weekly Team Sync", date:"2026-02-07T10:30:00Z", duration_minutes:45, duration_display:"45m", attendees:["Team","Ops","Product"], summary:"Reviewed blockers, escalation paths, and delivery risk.", action_items:[{ task:"Resolve dependency blocker", assignee:"Ops", done:false }], ai_insights:"Routine cross-functional sync.", meeting_type:"team", sentiment:"neutral", has_external_participants:false, external_domains:[] }
      ];
      const tasks = { todo:[{ title:"Draft onboarding checklist", agent:"📋", priority:"medium" },{ title:"Audit security logging", agent:"🛡️", priority:"high" },{ title:"Create release summary", agent:"🤖", priority:"low" }], doing:[{ title:"Refactor task assignment flow", agent:"🤖", priority:"urgent", progress:72 },{ title:"Sync council transcript", agent:"📋", priority:"medium", progress:44 }], needsInput:[{ title:"Clarify KPI target for Q3", agent:"📋", priority:"high" },{ title:"Approve policy exception", agent:"🛡️", priority:"urgent" }], done:[{ title:"Ship dashboard metrics", agent:"🤖", priority:"low" },{ title:"Summarize last meetings", agent:"🛡️", priority:"medium" },{ title:"Rebalance task queue", agent:"📋", priority:"medium" }] };
      const state = { tab:"deck", logFilter:"all", expandedCouncil:0, search:"", dateRange:"30d", hasActionItems:false, externalOnly:false, selectedTypes:["standup","sales","1-on-1","planning","team","external","interview","allhands"], sortBy:"recent", selectedMeeting: meetings[0] };
      const topTabs = document.getElementById("topTabs"); const sideTabs = document.getElementById("sidebarTabs"); const content = document.getElementById("content"); const globalSearch = document.getElementById("globalSearch");
      const icon = (name) => ({deck:"⌁",agents:"◎",board:"☰",log:"◌",council:"◈",meetings:"⌂"}[name]);
      function fmt(date){ return new Date(date).toLocaleString([], { year:"numeric", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }) }
      function cutoff(){ const base = new Date("2026-02-25T00:00:00Z"); const days = state.dateRange === "7d" ? 7 : state.dateRange === "30d" ? 30 : state.dateRange === "90d" ? 90 : null; return days == null ? null : new Date(base.getTime() - days*86400000) }
      function filteredMeetings(){ const c = cutoff(); return meetings.filter(m => (!state.search || m.title.toLowerCase().includes(state.search.toLowerCase())) && (!state.hasActionItems || m.action_items.some(a => !a.done)) && (!state.externalOnly || m.has_external_participants) && state.selectedTypes.includes(m.meeting_type) && (!c || new Date(m.date) > c)).sort((a,b)=> state.sortBy==="oldest" ? new Date(a.date)-new Date(b.date) : state.sortBy==="longest" ? b.duration_minutes-a.duration_minutes : new Date(b.date)-new Date(a.date)); }
      function counts(){ const ms = filteredMeetings(); return { meetings: ms.length, week: ms.filter(m => new Date(m.date) > new Date("2026-02-18T00:00:00Z")).length, openItems: ms.reduce((s,m)=>s + m.action_items.filter(a=>!a.done).length, 0), avgDuration: ms.length ? Math.round(ms.reduce((s,m)=>s+m.duration_minutes,0)/ms.length) : 0 }; }
      function metric(label, value, trend){ return `<div class="card metric"><div class="icon">⬢</div><div class="muted">${label}</div><strong>${value}</strong><div class="trend">${trend || "Live"}</div></div>`; }
      function tabsMarkup(active, compact=false){ return tabs.map(([id,label]) => `<button class="${active===id?'active':''}" data-tab="${id}">${compact?icon(id)+" ":""}${label}</button>`).join(''); }
      function title(text, sub){ return `<div class="section-title"><div><h3>${text}</h3><p>${sub||''}</p></div></div>`; }
      function render(){ topTabs.innerHTML = tabsMarkup(state.tab); sideTabs.innerHTML = tabsMarkup(state.tab,true); topTabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; render(); }); sideTabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; render(); });
        const c = counts();
        if (state.tab === 'deck') content.innerHTML = `
          <section class="grid-4">${metric('Active Agents',3,'+1 online')}${metric('Tasks in Flight',12,'+4 today')}${metric('Open Alerts',4,'2 require review')}${metric('Council Threads',2,'1 awaiting vote')}</section>
          <section class="grid-2">
            <div class="card section">${title('Mission Feed','Recent system movement and agent activity')}<div class="list">${activityFeed.map(a=>`<div class="item"><div><strong>${a.emoji} ${a.text}</strong><div class="muted tiny">${a.time}</div></div><span class="pill cyan">live</span></div>`).join('')}</div></div>
            <div class="card section">${title('Agent Status','Operational pulse of the workforce')}<div class="list">${agents.map(a=>`<div class="item"><div style="display:flex;gap:12px"><div class="agent-emoji">${a.emoji}</div><div><strong>${a.name}</strong><div class="muted tiny">${a.role}</div><div class="muted tiny">${a.activity}</div></div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px"><span class="dot ${a.status}"></span><span class="muted tiny">${a.lastSeen}</span></div></div>`).join('')}</div></div>
          </section>`;
        if (state.tab === 'agents') content.innerHTML = `<section class="grid-3">${agents.map(a=>`<div class="card agent-card"><div class="agent-head"><div class="left"><div class="agent-emoji">${a.emoji}</div><div><h3 style="margin:0">${a.name}</h3><div class="muted tiny">${a.type}</div><div class="muted tiny">${a.role}</div></div></div><span class="pill ${a.status==='active'?'green':'amber'}">${a.status}</span></div><div class="grid-4" style="grid-template-columns:repeat(3,1fr)"><div><div class="muted tiny">Tasks</div><strong>${a.tasksCompleted}</strong></div><div><div class="muted tiny">Accuracy</div><strong>${a.accuracy}%</strong></div><div><div class="muted tiny">Focus</div><strong style="color:${a.accent}">Prime</strong></div></div><div class="chip-row">${a.skills.map(s=>`<span class="chip">${s}</span>`).join('')}</div><button class="btn secondary">View Details</button></div>`).join('')}</section>`;
        if (state.tab === 'board') content.innerHTML = `<section class="kanban">${Object.entries(tasks).map(([column,items])=>`<div class="card col"><div class="section-title" style="margin-bottom:12px"><div><h3>${{todo:'To Do',doing:'Doing',needsInput:'Needs Input',done:'Done'}[column]}</h3><p>${items.length} cards</p></div><span class="pill">board</span></div><div class="list">${items.map(t=>`<div class="task"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><strong>${t.title}</strong><span class="prio ${t.priority}">${t.priority}</span></div><div class="muted tiny">${t.agent}${t.progress!=null?` · ${t.progress}% complete`:''}</div></div>`).join('')}</div></div>`).join('')}</section>`;
        if (state.tab === 'log') content.innerHTML = `<section class="card section filters"><div class="section-title"><div><h3>AI Log</h3><p>Chronological agent activity with category filtering</p></div></div><div class="filters-row"><select class="select" id="logFilter">${['all','observation','general','reminder','fyi'].map(c=>`<option ${state.logFilter===c?'selected':''}>${c}</option>`).join('')}</select></div></section><section class="card section"><div class="log">${logs.filter(l=>state.logFilter==='all'||l.category===state.logFilter).map(l=>`<div class="log-item"><div><span class="pill ${l.category==='observation'?'green':l.category==='general'?'':''}">${l.category}</span><div style="margin-top:8px"><strong>${l.agent}</strong><div>${l.text}</div></div></div><span class="muted tiny">${l.time}</span></div>`).join('')}</div></section>`;
        if (state.tab === 'council') content.innerHTML = `<section class="council">${councils.map((c,idx)=>`<div class="card council-card"><div class="c-head" data-council="${idx}"><div><h3 style="margin:0">${c.question}</h3><div class="muted tiny">${c.participants.length} participants</div></div><div style="display:flex;align-items:center;gap:10px"><span class="pill amber">${c.status}</span><span>${state.expandedCouncil===idx?'▾':'▸'}</span></div></div><div class="chip-row" style="margin-top:12px">${c.participants.map(p=>`<span class="chip">${p.emoji} ${p.name} ${p.sent}/${p.limit}</span>`).join('')}</div>${state.expandedCouncil===idx?`<div class="c-body">${c.messages.map(m=>`<div class="msg"><strong>${m.emoji} ${m.name} #${m.num}</strong><div>${m.text}</div><div class="muted tiny">${m.time}</div></div>`).join('')}</div>`:''}</div>`).join('')}</section>`;
        if (state.tab === 'meetings') content.innerHTML = `
          <section class="grid-4">${metric('Total Meetings',c.meetings,'Rolling total')}${metric('This Week',c.week,'Last 7 days')}${metric('Open Action Items',c.openItems,'Needs follow-up')}${metric('Avg Duration',`${c.avgDuration}m`,'Across filtered set')}</section>
          <section class="charts">
            <div class="card chart-box"><div class="section-title"><div><h3>Meeting Type Distribution</h3><p>Color-coded mix of meeting types</p></div></div><div class="donut"></div><div class="legend">${Object.entries(meetingTypes).map(([name,color])=>`<span><i style="background:${color}"></i>${name}</span>`).join('')}</div></div>
            <div class="card chart-box"><div class="section-title"><div><h3>Monthly Trend</h3><p>Meeting volume by month</p></div></div><div class="bars">${['Jan','Feb','Mar','Apr','May','Jun'].map((m,i)=>`<div class="bar"><div style="height:${42+i*20}px"></div><small>${m}</small></div>`).join('')}</div></div>
          </section>
          <section class="card section filters">
            <div class="section-title"><div><h3>Meeting Feed</h3><p>Search, filter, and inspect sessions</p></div></div>
            <div class="filters-row">
              <input class="input" id="search" value="${state.search}" placeholder="Search meetings by title">
              <select class="select" id="dateRange">${['7d','30d','90d','all'].map(v=>`<option ${state.dateRange===v?'selected':''}>${v}</option>`).join('')}</select>
              <label class="toggle"><input id="hasActionItems" type="checkbox" ${state.hasActionItems?'checked':''}> Has Action Items</label>
              <label class="toggle"><input id="externalOnly" type="checkbox" ${state.externalOnly?'checked':''}> External Only</label>
              <select class="select" id="sortBy"><option value="recent" ${state.sortBy==='recent'?'selected':''}>Most Recent</option><option value="oldest" ${state.sortBy==='oldest'?'selected':''}>Oldest First</option><option value="longest" ${state.sortBy==='longest'?'selected':''}>Longest Duration</option></select>
            </div>
            <div class="chip-row">${Object.keys(meetingTypes).map(type=>`<button class="toggle ${state.selectedTypes.includes(type)?'active':''}" data-type="${type}">${type}</button>`).join('')}</div>
          </section>
          <section class="grid-2">
            <div class="card section"><div class="list">${filteredMeetings().map(m=>`<button class="item" data-meeting="${m.title}" style="text-align:left;width:100%"><div><span class="pill" style="color:${meetingTypes[m.meeting_type]};background:${meetingTypes[m.meeting_type]}22">${m.meeting_type}</span><div style="margin-top:8px"><strong>${m.title}</strong><div class="muted tiny">${fmt(m.date)} · ${m.duration_display}</div></div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px"><div class="avatars">${m.attendees.slice(0,3).map(a=>`<span class="avatar">${a.slice(0,1)}</span>`).join('')}${m.attendees.length>3?`<span class="avatar">+${m.attendees.length-3}</span>`:''}</div><span class="pill">${m.action_items.length} actions</span></div></button>`).join('')}</div></div>
            <div class="card section"><div class="section-title"><div><h3>${state.selectedMeeting.title}</h3><p>${fmt(state.selectedMeeting.date)} · ${state.selectedMeeting.duration_display}</p></div><div style="display:flex;gap:10px"><button class="btn secondary">Open Recording</button><button class="btn secondary">Share Link</button></div></div><div class="stack"><div class="muted">${state.selectedMeeting.summary}</div><div><strong>Action Items</strong><div class="list" style="margin-top:10px">${state.selectedMeeting.action_items.map(item=>`<label class="item" style="align-items:center"><span><input type="checkbox" ${item.done?'checked':''}> ${item.task} · ${item.assignee}</span></label>`).join('')}</div></div><div class="muted">✨ ${state.selectedMeeting.ai_insights}</div><div><strong>Attendees</strong><div class="chip-row" style="margin-top:10px">${state.selectedMeeting.attendees.map(a=>`<span class="chip">${a}</span>`).join('')}</div></div><div><strong>Send To...</strong><div style="margin-top:10px"><select class="select"><option>Action Items</option><option>Proposals</option><option>Lead Magnets</option></select></div></div></div></div>
          </section>`;

        if (state.tab === 'log') document.getElementById('logFilter').onchange = e => { state.logFilter = e.target.value; render(); };
        if (state.tab === 'council') document.querySelectorAll('[data-council]').forEach(btn=>btn.onclick=()=>{ state.expandedCouncil = Number(btn.dataset.council)===state.expandedCouncil ? -1 : Number(btn.dataset.council); render(); });
        if (state.tab === 'meetings') {
          document.getElementById('search').oninput = e => { state.search = e.target.value; render(); };
          document.getElementById('dateRange').onchange = e => { state.dateRange = e.target.value; render(); };
          document.getElementById('hasActionItems').onchange = e => { state.hasActionItems = e.target.checked; render(); };
          document.getElementById('externalOnly').onchange = e => { state.externalOnly = e.target.checked; render(); };
          document.getElementById('sortBy').onchange = e => { state.sortBy = e.target.value; render(); };
          document.querySelectorAll('[data-type]').forEach(btn=>btn.onclick=()=>{ const t = btn.dataset.type; state.selectedTypes = state.selectedTypes.includes(t) ? state.selectedTypes.filter(v=>v!==t) : [...state.selectedTypes,t]; render(); });
          document.querySelectorAll('[data-meeting]').forEach(btn=>btn.onclick=()=>{ state.selectedMeeting = meetings.find(m=>m.title===btn.dataset.meeting); render(); });
        }
      }
      globalSearch.oninput = e => { state.search = e.target.value; if (state.tab === 'meetings') render(); };
      render();
    </script>
  </body>
</html>
